name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          # Root requirements deliberately excludes torch (wheel index differs
          # per platform — see SETUP.md). Install CPU torch/torchvision FIRST so
          # segmentation-models-pytorch resolves against them instead of pulling
          # multi-GB CUDA wheels from PyPI.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Import smoke (dashboard module)
        # src/app/app.py keeps all Streamlit calls inside main(), so a bare
        # import must succeed without a Streamlit runtime.
        run: python -c "import src.app.app"
