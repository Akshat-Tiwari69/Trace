name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-core.txt
            requirements-train.txt
            requirements-dev.txt
            deploy/requirements-app.txt

      - name: Install dependencies
        run: |
          python -m pip install pip==24.2
          # Root requirements deliberately excludes torch (wheel index differs
          # per platform — see SETUP.md). Install CPU torch/torchvision FIRST so
          # segmentation-models-pytorch resolves against them instead of pulling
          # multi-GB CUDA wheels from PyPI.
          pip install torch==2.4.1 torchvision==0.19.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Import smoke (production API)
        run: python -c "import src.app.api"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Static production build and bundle budgets
        run: |
          npm run build
          npm run budget
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser, responsive, and accessibility tests
        run: npm run test:e2e

  app-graph-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            deploy/requirements-app.txt
            requirements-core.txt
      - name: Install production-only dependencies
        run: |
          python -m pip install pip==24.2
          pip install -r deploy/requirements-app.txt
      - name: Exercise upload mask-to-resilience path
        run: |
          python - <<'PY'
          import numpy as np
          from src.app.upload_analysis import analyze_mask
          mask = np.zeros((128, 128), dtype=np.uint8)
          mask[31:34, 8:120] = 1
          mask[63:66, 8:120] = 1
          mask[95:98, 8:120] = 1
          mask[8:120, 31:34] = 1
          mask[8:120, 63:66] = 1
          mask[8:120, 95:98] = 1
          result = analyze_mask(mask, resolution_m=0.5)
          assert result.n_nodes > 1 and result.n_edges > 0
          PY
