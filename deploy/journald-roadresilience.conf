# Cap the systemd journal so dashboard/update logs can never fill the boot
# volume of the Always-Free box.
# Install (one-time, needs root):
#   sudo mkdir -p /etc/systemd/journald.conf.d
#   sudo cp deploy/journald-roadresilience.conf /etc/systemd/journald.conf.d/
#   sudo systemctl restart systemd-journald
[Journal]
SystemMaxUse=200M
