# Route Resilience — dashboard theme (A30 UI overhaul).
# Native-widget tokens: every built-in Streamlit component (selects, radios,
# charts, dataframe, dropdown menus) follows this dark theme, so the custom CSS
# in app.py only has to layer polish on top instead of fighting a light base.
[theme]
base = "dark"
primaryColor = "#F59E0B"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#131D31"
textColor = "#E2E8F0"
font = "sans serif"
